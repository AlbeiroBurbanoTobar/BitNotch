name: BitNotch
options:
  bundleIdPrefix: com.bitnotch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  BitNotch:
    type: application
    platform: macOS
    sources:
      - path: BitNotch
    info:
      path: BitNotch/Resources/Info.plist
      properties:
        CFBundleDisplayName: BitNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: BitNotch controls Spotify and Music to show what is playing and to play, pause and skip tracks from the notch.
    entitlements:
      path: BitNotch/Resources/BitNotch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Required by the hardened runtime to send Apple Events to Spotify and Music.
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitnotch.BitNotch
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
